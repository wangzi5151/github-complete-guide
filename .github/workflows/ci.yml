name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate Python scripts
        run: python3 -m py_compile scripts/*.py

      - name: Validate YAML workflows
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "OK #{f}" }' .github/workflows/*.yml

      - name: Check relative links
        run: python3 scripts/check_links.py

      - name: Check README statistics
        run: python3 scripts/check_stats.py

      - name: Check generated landing page is current
        run: python3 scripts/build_index.py --check
